[project]
name = "Divergence_Free_Interpolant"
version = "0.2.0"
description = "Divergence-free and curl-free interpolation of scattered vector data with matrix-valued RBFs"
readme = "README.md"
authors = [{ name = "Peteris Zvejnieks", email = "peterf610@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Interpolation", "Vector-Field", "Radial-Basis-Functions", "Divergence-Free", "Curl-Free"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.12",
    "sympy>=1.12.1",
]

[project.urls]
Homepage = "https://github.com/Peteris-Zvejnieks/DivergenceFreeInterpolation"
Repository = "https://github.com/Peteris-Zvejnieks/DivergenceFreeInterpolation"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
examples = [
    "matplotlib>=3.7",
    "pyqt6>=6.5",  # GUI backend for matplotlib; tkinter is often missing from pyenv/system builds
    "pyvista>=0.43",
]

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[tool.maturin]
# The Rust core (rust/) is built as divergence_free_interpolant._core, inside the Python package
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "divergence_free_interpolant._core"
features = ["python", "pyo3/extension-module"]

[tool.uv]
default-groups = ["dev"]
# Rebuild the extension when the Rust sources change
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/Cargo.toml" },
    { file = "rust/Cargo.lock" },
    { file = "rust/src/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff.lint.isort]
known-first-party = ["divergence_free_interpolant"]
known-local-folder = ["conftest", "reference_kernel"]
